<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Skoda Sales & Payout Insights</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="icon" type="image/png" href="/skoda.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Manrope:wght@700;800;900&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="/config.js"></script>
<style>
:root {
    --primary:        #9fe870;
    --primary-active: #cdffad;
    --primary-pale:   #e2f6d5;
    --on-primary:     #0e0f0c;

    --ink:            #0e0f0c;
    --ink-deep:       #163300;
    --body:           #454745;
    --mute:           #868685;

    --canvas:         #ffffff;
    --canvas-soft:    #f2f4ef;
    --canvas-line:    #e6ebe0;

    --positive:       #2ead4b;
    --warning:        #ffd11a;
    --warning-content:#4a3b1c;
    --negative:       #d03238;
    --accent-orange:  #ffc091;
    --accent-cyan:    #38c8ff;
    --accent-violet:  #9b7cff;
    --accent-teal:    #26c4a4;

    --shadow-sm: 0 1px 2px rgba(14,15,12,.04), 0 1px 3px rgba(14,15,12,.05);
    --shadow-md: 0 4px 14px rgba(14,15,12,.07), 0 1px 3px rgba(14,15,12,.04);

    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-xl: 24px;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
    font-family: 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--canvas-soft);
    color: var(--ink);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
}
.display { font-family: 'Manrope', 'Inter', system-ui, sans-serif; font-weight: 900; letter-spacing: -0.5px; }

/* ---------- Topbar ---------- */
.topbar {
    background: var(--canvas);
    border-bottom: 1px solid var(--canvas-line);
    padding: 0 32px;
    height: 68px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 10;
}
.brand { display: flex; align-items: center; gap: 14px; }
.brand img { height: 26px; }
.brand .brand-title {
    font-family: 'Manrope', sans-serif;
    font-weight: 900;
    font-size: 15px;
    letter-spacing: -.2px;
}
.brand .brand-sub {
    font-size: 11px;
    color: var(--mute);
    text-transform: uppercase;
    letter-spacing: 1.4px;
    font-weight: 700;
    margin-top: 2px;
}
.topbar-right { display: flex; gap: 10px; align-items: center; }
.stat-pill {
    background: var(--canvas-soft);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 12px;
    color: var(--body);
    font-weight: 600;
}
.stat-pill strong { color: var(--ink); }

/* ---------- Role selector (like Wise account switcher) ---------- */
.role-bar {
    background: var(--canvas);
    border-bottom: 1px solid var(--canvas-line);
    padding: 14px 32px;
    display: flex; gap: 10px; align-items: center;
    overflow-x: auto;
}
.role-tab {
    padding: 8px 18px;
    border-radius: 999px;
    background: var(--canvas-soft);
    color: var(--body);
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    border: 1px solid transparent;
    display: inline-flex; align-items: center; gap: 8px;
    transition: background .15s, color .15s, border-color .15s;
    white-space: nowrap;
}
.role-tab:hover { background: var(--canvas-line); }
.role-tab.active {
    background: var(--ink);
    color: #fff;
}
.role-tab .r-icon {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--primary);
}
.role-tab.active .r-icon { background: var(--primary-active); }
.role-bar .role-spacer { flex: 1; }
.filter-inline {
    display: flex; gap: 10px; align-items: center; flex-wrap: nowrap;
}
.filter-inline select {
    background: var(--canvas-soft);
    border: 1px solid transparent;
    border-radius: 999px;
    padding: 8px 14px;
    font-family: inherit;
    font-size: 13px;
    color: var(--ink);
    font-weight: 600;
    cursor: pointer;
    max-width: 220px;
}
.filter-inline select:focus { outline: none; box-shadow: 0 0 0 3px var(--primary-pale); }

/* ---------- Main ---------- */
.main { padding: 28px 32px 64px; max-width: 1600px; margin: 0 auto; }
.page-header {
    display: flex; align-items: flex-end; justify-content: space-between;
    margin-bottom: 20px; gap: 24px;
}
.page-header h1 {
    font-family: 'Manrope', sans-serif;
    font-weight: 900;
    font-size: 28px;
    letter-spacing: -.4px;
    margin: 0;
}
.page-header .subtitle {
    color: var(--mute);
    font-size: 13px;
    margin-top: 6px;
}
.help-tip {
    display: inline-block;
    background: var(--primary-pale);
    color: var(--ink-deep);
    padding: 3px 8px;
    border-radius: 999px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    cursor: help;
    margin-left: 6px;
}

/* ---------- KPI cards ---------- */
.kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px;
    margin-bottom: 24px;
}
.kpi-card {
    background: var(--canvas);
    border-radius: var(--radius-lg);
    padding: 22px 22px 20px;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--canvas-line);
    position: relative;
}
.kpi-card .kpi-label {
    font-size: 11px;
    color: var(--mute);
    text-transform: uppercase;
    letter-spacing: 1.4px;
    font-weight: 700;
    margin-bottom: 12px;
}
.kpi-card .kpi-value {
    font-family: 'Manrope', sans-serif;
    font-weight: 900;
    font-size: 30px;
    letter-spacing: -.6px;
    line-height: 1.1;
    color: var(--ink);
}
.kpi-card .kpi-value.small { font-size: 22px; }
.kpi-card .kpi-hint {
    margin-top: 8px;
    font-size: 12px;
    color: var(--body);
}
.kpi-card.accent { background: var(--ink); color: #fff; }
.kpi-card.accent .kpi-label { color: rgba(255,255,255,.7); }
.kpi-card.accent .kpi-value { color: var(--primary); }
.kpi-card.accent .kpi-hint { color: rgba(255,255,255,.7); }

.kpi-card .kpi-chip {
    position: absolute; top: 20px; right: 20px;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    background: var(--primary-pale); color: var(--ink-deep);
}
.kpi-card .kpi-chip.warn { background: #fff3d1; color: var(--warning-content); }
.kpi-card .kpi-chip.bad  { background: #ffe1e1; color: var(--negative); }

/* ---------- Panels ---------- */
.panel-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 16px;
}
.panel-row.thirds { grid-template-columns: 1fr 1fr 1fr; }
.panel-row.wide-left { grid-template-columns: 2fr 1fr; }
.panel {
    background: var(--canvas);
    border: 1px solid var(--canvas-line);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    padding: 22px 22px 20px;
    min-height: 320px;
    display: flex; flex-direction: column;
}
.panel.full { grid-column: 1 / -1; }
.panel-head {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 14px;
}
.panel-head h3 {
    margin: 0;
    font-family: 'Manrope', sans-serif;
    font-weight: 800;
    font-size: 15px;
    letter-spacing: -.2px;
}
.panel-head .p-sub {
    font-size: 11px;
    color: var(--mute);
    text-transform: uppercase;
    letter-spacing: 1.2px;
    font-weight: 700;
}
.panel-body { flex: 1; min-height: 0; position: relative; }
.chart-wrap { position: relative; height: 260px; }
.chart-wrap.tall { height: 320px; }

/* ---------- Tables ---------- */
.data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
}
.data-table thead th {
    text-align: left;
    background: var(--canvas-soft);
    color: var(--body);
    font-weight: 700;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--canvas-line);
    white-space: nowrap;
    position: sticky; top: 0;
}
.data-table td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--canvas-line);
    vertical-align: top;
}
.data-table tbody tr:hover { background: var(--canvas-soft); }
.data-table .num  { text-align: right; font-variant-numeric: tabular-nums; }
.data-table .rank { color: var(--mute); font-weight: 700; width: 24px; }
.table-scroll { overflow-x: auto; max-height: 520px; }

.badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    background: var(--canvas-soft);
    color: var(--body);
    letter-spacing: .2px;
    white-space: nowrap;
}
.badge.HIGH, .badge.STRONG, .badge.APPROVED, .badge.GOLD, .badge.ACTIVE, .badge.ADEQUATE { background: var(--primary-pale); color: var(--ink-deep); }
.badge.MEDIUM, .badge.AVERAGE, .badge.WATCH, .badge.SILVER, .badge.WARM, .badge.PENDING, .badge.MODERATE { background: #fff3d1; color: var(--warning-content); }
.badge.LOW, .badge.UNDER, .badge.NEEDS, .badge.HOT, .badge.REJECTED, .badge.NEGATIVE, .badge.DORMANT, .badge.INCREASE { background: #ffe1e1; color: var(--negative); }
.badge.NEUTRAL, .badge.BRONZE, .badge.COOL { background: var(--canvas-line); color: var(--body); }

/* ---------- Glossary popover ---------- */
.gloss {
    text-decoration: underline dotted var(--mute);
    cursor: help;
}

/* ---------- Loader ---------- */
.spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid var(--canvas-line);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.empty {
    padding: 40px 16px;
    text-align: center;
    color: var(--mute);
    font-size: 13px;
}

/* ---------- Reports view specific ---------- */
.report-picker {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
}
.report-tile {
    background: var(--canvas);
    border: 1px solid var(--canvas-line);
    border-radius: var(--radius-md);
    padding: 16px;
    cursor: pointer;
    transition: transform .12s, box-shadow .15s, border-color .15s;
}
.report-tile:hover {
    border-color: var(--primary);
    transform: translateY(-1px);
    box-shadow: var(--shadow-md);
}
.report-tile.active {
    border-color: var(--ink);
    background: var(--primary-pale);
}
.report-tile .rt-num {
    display: inline-block;
    background: var(--canvas-soft);
    color: var(--ink);
    font-weight: 700;
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 999px;
    margin-bottom: 8px;
}
.report-tile.active .rt-num { background: var(--primary); }
.report-tile .rt-title {
    font-weight: 700;
    font-size: 14px;
    color: var(--ink);
    margin-bottom: 4px;
}
.report-tile .rt-desc {
    font-size: 12px;
    color: var(--mute);
    line-height: 1.4;
}

.section-divider {
    margin: 32px 0 16px;
    font-family: 'Manrope', sans-serif;
    font-weight: 800;
    font-size: 16px;
    color: var(--ink);
    display: flex; align-items: center; gap: 12px;
}
.section-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--canvas-line);
}

/* ---------- Dealer picker ---------- */
.dealer-picker {
    display: flex; gap: 12px; align-items: center;
    background: var(--canvas);
    border: 1px solid var(--canvas-line);
    border-radius: var(--radius-md);
    padding: 12px 16px;
    margin-bottom: 20px;
}
.dealer-picker input, .dealer-picker select {
    flex: 1;
    padding: 8px 12px;
    border: 1px solid var(--canvas-line);
    border-radius: var(--radius-md);
    font-family: inherit;
    font-size: 13px;
}

.progress-bar {
    background: var(--canvas-soft);
    border-radius: 999px;
    height: 10px;
    overflow: hidden;
    margin-top: 6px;
}
.progress-bar .fill {
    height: 100%;
    background: var(--primary);
    border-radius: 999px;
    transition: width .4s;
}
.progress-bar .fill.warn { background: var(--warning); }
.progress-bar .fill.bad  { background: var(--negative); }

/* ---------- Reports tab ---------- */
.filter-card {
    background: var(--canvas);
    border: 1px solid var(--canvas-line);
    border-radius: var(--radius-lg);
    padding: 20px;
    margin-bottom: 16px;
}
.filter-card .fc-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px;
}
.filter-card h4 {
    margin: 0;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.4px;
    color: var(--mute);
    font-weight: 700;
}
.filter-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 10px;
}
.filter-grid label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    color: var(--body);
    margin-bottom: 4px;
}
.filter-grid select, .filter-grid input {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--canvas-line);
    border-radius: var(--radius-md);
    font-family: inherit;
    font-size: 13px;
    background: var(--canvas);
}
.action-row { margin-top: 14px; display: flex; gap: 10px; flex-wrap: wrap; }
button {
    padding: 10px 18px;
    border-radius: 999px;
    border: none;
    font-family: inherit;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    transition: transform .1s, background .15s;
}
.btn-primary { background: var(--primary); color: var(--on-primary); }
.btn-primary:hover { background: var(--primary-active); transform: translateY(-1px); }
.btn-secondary { background: var(--canvas-soft); color: var(--ink); }
.btn-secondary:hover { background: var(--canvas-line); }

/* ---------- Responsive ---------- */
@media (max-width: 900px) {
    .panel-row, .panel-row.thirds, .panel-row.wide-left { grid-template-columns: 1fr; }
    .main { padding: 20px 16px 40px; }
    .topbar { padding: 0 16px; }
    .role-bar { padding: 12px 16px; }
    .page-header { flex-direction: column; align-items: flex-start; }
}
</style>
</head>
<body>

<!-- ============================== Topbar ============================== -->
<header class="topbar">
    <div class="brand">
        <img src="/skoda.png" alt="Skoda" onerror="this.style.display='none'"/>
        <div>
            <div class="brand-title">Sales &amp; Payout Insights</div>
            <div class="brand-sub">Skoda Auto India · March 2026</div>
        </div>
    </div>
    <div class="topbar-right">
        <span class="stat-pill"><strong id="stat-schemes">–</strong> schemes</span>
        <span class="stat-pill"><strong id="stat-dealers">–</strong> dealers</span>
        <span class="stat-pill"><strong id="stat-vins">–</strong> vehicles</span>
    </div>
</header>

<!-- ============================== Role bar ============================== -->
<div class="role-bar">
    <span class="role-tab active" data-role="manager"><span class="r-icon"></span>Sales Manager</span>
    <span class="role-tab" data-role="dealer"><span class="r-icon"></span>Dealer View</span>
    <span class="role-tab" data-role="finance"><span class="r-icon"></span>Finance / Audit</span>
    <span class="role-tab" data-role="reports"><span class="r-icon"></span>Detailed Reports</span>
    <span class="role-spacer"></span>
    <div class="filter-inline">
        <select id="global-period"></select>
        <select id="global-zone"></select>
        <select id="global-kind">
            <option value="">All scheme kinds</option>
            <option value="RETAIL">Retail schemes</option>
            <option value="WHOLESALE">Wholesale schemes</option>
        </select>
    </div>
</div>

<!-- ============================== Main ============================== -->
<main class="main" id="main"></main>

<script>
/* ==========================================================
   Config & helpers
========================================================== */
const API_BASE = (window.__API_BASE || '').replace(/\/$/, '');
const API = p => `${API_BASE}${p}`;

const CROREE = 1e7;
const LAKH = 1e5;
const inrCr = v => v == null || v === '' ? '—' : '₹' + (Number(v) / CROREE).toFixed(2) + ' Cr';
const inr = v => v == null || v === '' ? '—' : '₹' + Number(v).toLocaleString('en-IN', { maximumFractionDigits: 0 });
const inrShort = v => {
    if (v == null || v === '') return '—';
    const n = Number(v);
    if (Math.abs(n) >= CROREE) return '₹' + (n / CROREE).toFixed(2) + 'Cr';
    if (Math.abs(n) >= LAKH) return '₹' + (n / LAKH).toFixed(1) + 'L';
    return '₹' + n.toLocaleString('en-IN', { maximumFractionDigits: 0 });
};
const num = v => v == null || v === '' ? '—' : Number(v).toLocaleString('en-IN');
const pct = v => v == null || v === '' ? '—' : Number(v).toFixed(1) + '%';
const fmt = { inr, int: num, pct, num: v => v == null ? '—' : Number(v).toLocaleString('en-IN', { maximumFractionDigits: 1 }),
              text: v => v == null || v === '' ? '—' : String(v),
              badge: v => {
                  if (!v) return '—';
                  const cls = String(v).split(/[\s+\-(]/)[0].replace(/[^A-Z_]/g, '');
                  return `<span class="badge ${cls}">${v}</span>`;
              } };

const CHART_COLORS = ['#9fe870', '#38c8ff', '#9b7cff', '#ffc091', '#26c4a4', '#ffd11a', '#ff8c8c', '#3a5a40', '#4a90e2', '#c084fc', '#f472b6'];

/* Glossary of jargon → plain english (shown as tooltips) */
const GLOSS = {
    'SKSL':      'Skoda Sales Scheme Ledger — the scheme code prefix used internally.',
    'ISAC':      'Integrated Statement of Adjustment & Credit — the actual payment ledger between Skoda and the dealer.',
    'RFA':       'Request For Authorization — one authorized payment line to a dealer.',
    'DAN':       'Dealer Advance / Nurture Support — upfront tactical support paid per retail delivery.',
    'CP8':       'Checkpoint 8 — the wholesale checkpoint when a vehicle leaves the plant.',
    'MY':        'Model Year (car spec year).',
    'VY':        'Vehicle Year (year of production).',
    'RB':        'Regional Booster — a region-specific model incentive.',
    'RSM':       'Regional Sales Manager — cluster owner covering multiple dealers.',
    'HSN':       'Harmonized System Nomenclature — the tax classification code.',
    'Ex-SR':     'Ex-Showroom Retail price.',
    'CDD':       'Customer Delivery Document.',
    'FnF':       'Full & Final settlement — dealer exit finance closure.',
    'INR':       'Indian Rupee.',
    'Cr':        'Crore = 10,000,000 (1 followed by 7 zeros).',
    'Lakh':      'Lakh = 100,000.'
};

function tip(term) {
    const info = GLOSS[term] || '';
    return `<span class="gloss" title="${info}">${term}</span>`;
}

/* ==========================================================
   State
========================================================== */
const STATE = {
    role: 'manager',
    period: '2026-03',
    zone: '',
    scheme_kind: '',
    dealer_code: '',
    meta: null
};
const CHARTS = {};

function qs() {
    const p = new URLSearchParams();
    if (STATE.period)      p.set('period_yyyymm', STATE.period);
    if (STATE.zone)        p.set('zone', STATE.zone);
    if (STATE.scheme_kind) p.set('scheme_kind', STATE.scheme_kind);
    if (STATE.dealer_code) p.set('dealer_code', STATE.dealer_code);
    return p.toString();
}
async function fetchJson(path) {
    const r = await fetch(API(path));
    if (!r.ok) throw new Error(`${path} → ${r.status}`);
    return r.json();
}

/* ==========================================================
   Bootstrap
========================================================== */
async function boot() {
    try {
        STATE.meta = await fetchJson('/api/meta');
    } catch (e) {
        document.getElementById('main').innerHTML =
            `<div class="empty">Backend not reachable. Is <code>npm start</code> running on this port?</div>`;
        console.error(e);
        return;
    }
    if (STATE.meta.empty) {
        document.getElementById('main').innerHTML = `
          <div class="page-header"><div>
            <h1>Database is empty</h1>
            <div class="subtitle">The reporting DB has no data yet.</div>
          </div></div>
          <div class="panel full">
            <div class="panel-head"><h3>How to populate</h3></div>
            <div style="padding:16px 0; color:var(--body); line-height:1.7;">
              ${STATE.meta.message || ''}<br><br>
              On your local machine (where the <code>files/</code> folder lives), run:
              <pre style="background:var(--canvas-soft);padding:16px;border-radius:8px;margin-top:12px;overflow:auto;">DATABASE_URL="${'<your postgres url>'}" node etl.js</pre>
              Once ingest completes, refresh this page.
            </div>
          </div>
        `;
        return;
    }
    initFilters();
    document.getElementById('stat-schemes').textContent = STATE.meta.filter_options.scheme.length;
    document.getElementById('stat-dealers').textContent = STATE.meta.filter_options.dealer.length;
    // vehicles: sum of scheme lines (rough) — we'll ask for it via manager KPI
    document.querySelectorAll('.role-tab').forEach(el => {
        el.addEventListener('click', () => setRole(el.dataset.role));
    });
    setRole('manager');
}

function initFilters() {
    const period = document.getElementById('global-period');
    period.innerHTML = STATE.meta.filter_options.period_yyyymm
        .map(p => `<option value="${p}">${p}</option>`).join('');
    period.value = STATE.period;
    period.onchange = () => { STATE.period = period.value; render(); };

    const zone = document.getElementById('global-zone');
    zone.innerHTML = '<option value="">All zones</option>' +
        STATE.meta.filter_options.zone.map(z => `<option value="${z}">${z}</option>`).join('');
    zone.onchange = () => { STATE.zone = zone.value; render(); };

    const kind = document.getElementById('global-kind');
    kind.onchange = () => { STATE.scheme_kind = kind.value; render(); };
}

function setRole(role) {
    STATE.role = role;
    document.querySelectorAll('.role-tab').forEach(el =>
        el.classList.toggle('active', el.dataset.role === role));
    render();
}

async function render() {
    Object.values(CHARTS).forEach(c => c.destroy());
    for (const k in CHARTS) delete CHARTS[k];
    const main = document.getElementById('main');
    main.innerHTML = `<div class="empty"><span class="spinner"></span>Loading…</div>`;
    try {
        if      (STATE.role === 'manager') await renderManager(main);
        else if (STATE.role === 'dealer')  await renderDealer(main);
        else if (STATE.role === 'finance') await renderFinance(main);
        else                                await renderReports(main);
    } catch (e) {
        main.innerHTML = `<div class="empty">Error: ${e.message}</div>`;
        console.error(e);
    }
}

          <h1>Dealer View</h1>
          <div class="subtitle">Pick a dealer to see their monthly targets, sales, and how much they've earned vs been paid.</div>

async function renderDealerBody() {
    const body = document.getElementById('dealer-body');

    const rtAch = info.retail_ach_pct;
    const wsAch = info.wholesale_ach_pct;
    const pctClass = v => v == null ? '' : (v >= 90 ? '' : v >= 60 ? 'warn' : 'bad');
    const pctFill = v => Math.min(100, Math.max(0, v || 0));

    // Per-scheme breakdown for this dealer
    const scheme = await fetchJson('/api/charts/reconciliation?' + q);

    body.innerHTML = `
      <div class="kpi-grid">
        <div class="kpi-card accent">
          <div class="kpi-label">${info.dealer_short_name || info.dealer_name || info.dealer_code}</div>
          <div class="kpi-value small">${info.dealer_name || '—'}</div>
          <div class="kpi-hint">${info.zone || '—'} · ${tip('RSM')} ${info.rsm || '—'}</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Retail Achievement</div>
          <div class="kpi-value">${info.retail_sold} <span style="font-size:14px;color:var(--mute);font-weight:600;">of ${info.retail_target || '—'}</span></div>
          <div class="progress-bar"><div class="fill ${pctClass(rtAch)}" style="width:${pctFill(rtAch)}%"></div></div>
          <div class="kpi-hint">${rtAch == null ? 'No target set' : rtAch + '% of monthly target'}</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Wholesale Achievement</div>
          <div class="kpi-value">${info.wholesale_taken} <span style="font-size:14px;color:var(--mute);font-weight:600;">of ${info.wholesale_target || '—'}</span></div>
          <div class="progress-bar"><div class="fill ${pctClass(wsAch)}" style="width:${pctFill(wsAch)}%"></div></div>
          <div class="kpi-hint">${wsAch == null ? 'No target set' : wsAch + '% of monthly target'}</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Earned this Period</div>
          <div class="kpi-value">${inrCr(info.claimed)}</div>
          <div class="kpi-hint">${inrCr(info.paid)} received · ${inrCr(info.pending)} still pending</div>
        </div>
      </div>

      <div class="panel full">
        <div class="panel-head">
          <h3>Scheme-by-Scheme Earnings</h3>
          <span class="p-sub">${STATE.period}</span>
        </div>
        <div class="table-scroll">
          <table class="data-table">
            <thead>
              <tr>
                <th>Scheme</th>
                <th class="num">Amount Owed</th>
                <th class="num">Paid via ${tip('ISAC')}</th>
                <th class="num">Pending</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
              ${scheme.data.length ? scheme.data.map(r => {
                const paidPct = r.claimed ? Math.round(100 * r.paid / r.claimed) : 0;
                const st = paidPct >= 95 ? 'APPROVED' : paidPct >= 50 ? 'PENDING' : paidPct > 0 ? 'PENDING' : 'REJECTED';
                return `
                  <tr>
                    <td>${r.scheme_name || r.scheme_code}</td>
                    <td class="num">${inr(r.claimed)}</td>
                    <td class="num">${inr(r.paid)}</td>
                    <td class="num">${inr(r.gap)}</td>
                    <td>${fmt.badge(st)} ${paidPct}%</td>

let CURRENT_REPORT = null;
async function renderReports(main) {
    main.innerHTML = `
      <div class="page-header">
        <div>
          <h1>Detailed Reports</h1>
          <div class="subtitle">Nine analytical reports. Click a tile to open; filter and download as CSV/Excel.</div>

      <div id="report-body"></div>
    `;
    const tiles = document.getElementById('report-tiles');
    STATE.meta.reports.forEach(r => {
        const el = document.createElement('div');
        el.className = 'report-tile' + (CURRENT_REPORT === r.id ? ' active' : '');
        const numMatch = r.title.match(/^(\d+)\./);
        const shortTitle = r.title.replace(/^\d+\.\s*/, '');
        el.innerHTML = `
            <span class="rt-num">${numMatch ? numMatch[1] : '?'}</span>
            <div class="rt-title">${shortTitle}</div>

async function selectReport(id) {
    CURRENT_REPORT = id;
    document.querySelectorAll('.report-tile').forEach(el =>
        el.classList.toggle('active', el.querySelector('.rt-title').textContent ===
            STATE.meta.reports.find(r => r.id === id).title.replace(/^\d+\.\s*/, '')));
    await renderReport(id);
}

async function renderReport(id) {
    const def = STATE.meta.reports.find(r => r.id === id);
    const body = document.getElementById('report-body');
    body.innerHTML = `<div class="empty"><span class="spinner"></span>Loading…</div>`;

    // Filter card
    const opts = STATE.meta.filter_options;
    const filterSpec = {
        period_yyyymm: { label: 'Period',       options: [{v:'',l:'All periods'}, ...opts.period_yyyymm.map(p => ({v:p,l:p}))] },
        zone:          { label: 'Zone',         options: [{v:'',l:'All zones'}, ...opts.zone.map(z=>({v:z,l:z}))] },
        dealer_code:   { label: 'Dealer',       options: [{v:'',l:'All dealers'}, ...opts.dealer.map(d=>({v:d.dealer_code, l: d.dealer_name}))] },
        scheme_code:   { label: 'Scheme',       options: [{v:'',l:'All schemes'}, ...opts.scheme.map(s=>({v:s.scheme_code, l:s.scheme_name}))] },
        scheme_type:   { label: 'Scheme Type',  options: [{v:'',l:'All'}, ...opts.scheme_type.map(x=>({v:x,l:x.replace(/_/g,' ')}))] },
        scheme_kind:   { label: 'Scheme Kind',  options: [{v:'',l:'All'}, ...opts.scheme_kind.map(x=>({v:x,l:x}))] },
        group_by:      { label: 'Group By',     options: opts.group_by.map(x=>({v:x,l:x})) }
    };
    const params = new URLSearchParams(qs());
    body.innerHTML = `
      <div class="filter-card">
        <div class="fc-head">
          <h4>${def.title}</h4>
          <span style="color:var(--mute); font-size:12px;">${def.description}</span>
        </div>
        <div class="filter-grid">
          ${def.filters.map(f => {
              const spec = filterSpec[f];
              if (!spec) return '';
              const cur = params.get(f) || '';
              return `
                <div>
                  <label>${spec.label}</label>
                  <select data-filter="${f}">
                    ${spec.options.map(o => `<option value="${o.v}" ${o.v === cur ? 'selected' : ''}>${o.l}</option>`).join('')}
                  </select>
                </div>`;
          }).join('')}
        </div>
        <div class="action-row">
          <button class="btn-primary" id="run-report">Run report</button>
          <button class="btn-secondary" onclick="window.open(API_BASE + '/api/reports/${id}/download?${params.toString()}&format=xlsx')">Download Excel</button>
          <button class="btn-secondary" onclick="window.open(API_BASE + '/api/reports/${id}/download?${params.toString()}&format=csv')">Download CSV</button>
        </div>
      </div>
      <div id="report-result"></div>
    `;
    document.getElementById('run-report').onclick = runReport;
    await runReport();

    async function runReport() {
        const result = document.getElementById('report-result');
        result.innerHTML = `<div class="empty"><span class="spinner"></span>Running…</div>`;
        const p = new URLSearchParams();
        document.querySelectorAll('.filter-card select').forEach(s => {
            if (s.value) p.set(s.dataset.filter, s.value);
        });
        // also apply global filters
        if (STATE.period && !p.get('period_yyyymm')) p.set('period_yyyymm', STATE.period);
        if (STATE.zone && !p.get('zone'))            p.set('zone', STATE.zone);

        const data = await fetchJson(`/api/reports/${id}?${p.toString()}`);
        const cols = def.columns || data.meta.columns;
        result.innerHTML = `
          <div class="panel full">
            <div class="panel-head">
              <h3>${data.meta.title}</h3>
              <span class="p-sub">${data.rows.length} rows</span>
            </div>
            <div class="table-scroll">
              <table class="data-table">
                <thead>
                  <tr>${cols.map(c => `<th class="${c.fmt === 'inr' || c.fmt === 'int' || c.fmt === 'num' || c.fmt === 'pct' ? 'num' : ''}">${c.label}</th>`).join('')}</tr>
                </thead>
                <tbody>
                  ${data.rows.length ? data.rows.map(row => `
                    <tr>${cols.map(c => `<td class="${c.fmt === 'inr' || c.fmt === 'int' || c.fmt === 'num' || c.fmt === 'pct' ? 'num' : ''}">${fmt[c.fmt] ? fmt[c.fmt](row[c.key]) : (row[c.key] ?? '—')}</td>`).join('')}</tr>
                  `).join('') : '<tr><td colspan="99" class="empty">No rows.</td></tr>'}
                </tbody>
              </table>
            </div>
          </div>
        `;
    }
}

/* ==========================================================
   Chart helpers
========================================================== */
function bar(canvasId, labels, series, opts = {}) {
    const ctx = document.getElementById(canvasId);
    if (!ctx) return;
    CHARTS[canvasId] = new Chart(ctx, {
        type: 'bar',
        data: {
            labels,
            datasets: series.map((s, i) => ({
                label: s.label,
                data: s.data,
                backgroundColor: s.color || CHART_COLORS[i % CHART_COLORS.length],
                borderRadius: 6,
                barPercentage: 0.75,
                categoryPercentage: 0.75
            }))
        },
        options: {
            indexAxis: opts.horizontal ? 'y' : 'x',
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { position: 'top', labels: { font: { size: 11 }, boxWidth: 10 } },
                tooltip: {
                    callbacks: {
                        label: ctx => `${ctx.dataset.label}: ${inrShort(ctx.parsed[opts.horizontal ? 'x' : 'y'])}`
                    }
                }
            },
            scales: {
                x: { ticks: { font: { size: 10 }, callback: v => opts.horizontal ? inrShort(v) : v } },
                y: { ticks: { font: { size: 10 }, callback: v => opts.horizontal ? v : inrShort(v) } }
            }
        }
    });
}

function doughnut(canvasId, labels, data, opts = {}) {
    const ctx = document.getElementById(canvasId);
    if (!ctx) return;
    const colors = opts.colors || labels.map((_, i) => CHART_COLORS[i % CHART_COLORS.length]);
    CHARTS[canvasId] = new Chart(ctx, {
        type: 'doughnut',
        data: {
            labels,
            datasets: [{
                data,
                backgroundColor: colors,
                borderWidth: 2,
                borderColor: '#fff'
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            cutout: '58%',
            plugins: {
                legend: {
                    position: 'right',
                    labels: {
                        font: { size: 11 },
                        boxWidth: 10,
                        generateLabels: chart => {
                            const dset = chart.data.datasets[0];
                            const total = dset.data.reduce((s,v)=>s+v,0) || 1;
                            return chart.data.labels.map((label, i) => ({
                                text: `${label.length > 22 ? label.slice(0,22) + '…' : label} — ${((dset.data[i]/total)*100).toFixed(0)}%`,
                                fillStyle: colors[i],
                                strokeStyle: '#fff',
                                lineWidth: 1,
                                index: i
                            }));
                        }
                    }
                },
                tooltip: {
                    callbacks: {
                        label: ctx => `${ctx.label}: ${inrShort(ctx.parsed)} (${((ctx.parsed / ctx.dataset.data.reduce((s,v)=>s+v,0)) * 100).toFixed(1)}%)`
                    }
                }
            }
        }
    });
}
