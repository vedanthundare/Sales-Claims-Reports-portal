# Render Blueprint — deploys the Skoda Reports service.
# Push this repo to GitHub, then in Render:
#   New → Blueprint → pick the repo → Apply.
# Render will read this file and create the web service automatically.

services:
  - type: web
    name: skoda-reports
    runtime: node
    plan: free                       # bump to "starter" ($7/mo) for always-on + persistent disk
    rootDir: skoda-reports           # remove this line if the repo IS the skoda-reports folder
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
    autoDeploy: true                 # redeploy on every push to the configured branch
    healthCheckPath: /api/meta
